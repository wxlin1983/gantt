server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin proxy: the session cookie needs no CORS or SameSite
    # exceptions this way, and the frontend needs no API base URL.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
